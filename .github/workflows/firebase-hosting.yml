name: Deploy Firebase Hosting

on:
  push:
    branches:
      - firebase-hosting
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/firebase-hosting' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: id-gestao
          workload_identity_provider: projects/218040880055/locations/global/workloadIdentityPools/github-actions/providers/idgestao-frontend
          service_account: github-firebase-hosting@id-gestao.iam.gserviceaccount.com

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build Firebase application
        run: bun run build:firebase

      - name: Deploy to Firebase Hosting
        run: bunx firebase-tools@latest deploy --only hosting --project id-gestao --non-interactive
