name: Deploy Firebase Hosting

on:
  push:
    branches:
      - firebase-hosting
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID_GESTAO_WEB }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/firebase-hosting' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build Firebase application
        run: bun run build:firebase

      - name: Verify Firebase credential
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: |
          echo "Missing FIREBASE_SERVICE_ACCOUNT_ID_GESTAO_WEB repository secret."
          exit 1

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID_GESTAO_WEB }}
          channelId: live
          projectId: id-gestao-web
